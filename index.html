#botSpeedControl {
  position: fixed;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 6;
  width: 52px;
  min-height: 190px;
  padding: 10px 7px;
  border-radius: 14px;
  background: var(--bar);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;

#botSpeedControl label {
  font-size: 11px;
  font-weight: 700;

}

/* Add this after your existing SPEEDS constant */
const botSpeedEl = document.getElementById("botSpeed");
const botSpeedValue = document.getElementById("botSpeedValue");

/*
  1 = very slow
  5 = normal
  10 = very fast

  The slider changes the bot's actual tick delay immediately.
*/
function getBotDelay() {
  const v = Number(botSpeedEl.value);
  const minDelay = 45;
  const maxDelay = 300;

  // Higher slider value = faster bot.
  return maxDelay - ((v - 1) / 9) * (maxDelay - minDelay);
}

function updateBotSpeed() {
  const value = Number(botSpeedEl.value);
  botSpeedValue.textContent = value;

  if (botOn && state === "running") {
    const oldDelay = delay;
    const newDelay = getBotDelay();

    // Preserve the current interpolation position when speed changes.
    if (oldDelay > 0) {
      acc = Math.min(newDelay - 1, acc * (newDelay / oldDelay));
    }

    delay = newDelay;
  }
}

botSpeedEl.addEventListener("input", updateBotSpeed);
updateBotSpeed();
